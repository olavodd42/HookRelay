name: hookrelay

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://hookrelay:hookrelay@db:5432/hookrelay
  JWT_SECRET: dev-only-change-me-dev-only-change-me   # SÓ para uso local
  ENCRYPTION_KEY: "${ENCRYPTION_KEY:?gere com: openssl rand -base64 32}"
  ALLOW_HTTP_ENDPOINTS: "true"      # permite http:// e localhost, apenas em demo local
  SSRF_ALLOW_PRIVATE: "true"        # idem

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookrelay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookrelay}
      POSTGRES_DB: ${POSTGRES_DB:-hookrelay}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay -d hookrelay"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./apps/api
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: ./apps/api
    environment: *app-env
    ports: ["3000:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: ./apps/api
    command: ["node", "dist/worker.js"]
    environment: *app-env
    healthcheck: { disable: true }
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata: